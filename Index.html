<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vacation survey</title>
<style>
  :root {
    --bg: #eef4f1;
    --card: #ffffff;
    --ink: #10261f;
    --muted: #5b6b66;
    --line: #d5e0db;
    --yes: #1f8a5b;      /* Yes / natural */
    --no: #6b7a90;       /* No */
    --manmade: #3b4cca;  /* man-made */
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1a16;
      --card: #16261f;
      --ink: #e8f2ed;
      --muted: #9db3aa;
      --line: #27403a;
      --yes: #3fbf88;
      --no: #93a2b8;
      --manmade: #7c8cff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    line-height: 1.45;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    min-height: 100vh;
  }
  main { max-width: 520px; margin: 0 auto; padding: 24px 18px 40px; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
  h2 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 20px; letter-spacing: -0.01em; }
  p  { margin: 0 0 16px; color: var(--muted); }
  .banner {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--manmade);
    border-radius: 10px; padding: 10px 12px; font-size: .85rem; color: var(--muted); margin-bottom: 18px;
  }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; background: var(--yes); transition: width .3s ease; }
  .counter { font-size: .85rem; color: var(--muted); margin-bottom: 22px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type=text] {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 14px;
    border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  }
  input[type=text]:focus-visible, button:focus-visible { outline: 3px solid var(--manmade); outline-offset: 2px; }
  .options { display: grid; gap: 12px; }
  button {
    font: inherit; font-weight: 700; font-size: 1.15rem; cursor: pointer;
    border: 2px solid transparent; border-radius: var(--radius); padding: 18px 16px; color: #fff;
  }
  button:active { transform: scale(.98); }
  .b-yes { background: var(--yes); }
  .b-no { background: var(--no); }
  .b-nat { background: var(--yes); }
  .b-man { background: var(--manmade); }
  .b-main { background: var(--ink); color: var(--bg); margin-top: 16px; width: 100%; }
  .b-soft { background: transparent; color: var(--muted); border-color: var(--line); font-size: .95rem; padding: 12px; margin-top: 14px; width: 100%; }
  .error { color: #c0392b; font-size: .9rem; min-height: 1.3em; margin-top: 8px; }
  @media (prefers-color-scheme: dark) { .error { color: #ff8a7a; } }

  /* Results */
  .total { font-size: 3rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .total small { display: block; font-size: .95rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 4px; }
  .question { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 14px; }
  .question h3 { margin: 0 0 12px; font-size: 1rem; line-height: 1.3; }
  .row { display: grid; grid-template-columns: 72px 1fr 64px; align-items: center; gap: 10px; margin-top: 8px; font-size: .95rem; }
  .row .lbl { font-weight: 600; }
  .row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .bar { height: 22px; background: var(--line); border-radius: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 8px; transition: width .6s ease; }
  .final { border: 2px solid var(--ink); }
  .final .row { grid-template-columns: 84px 1fr 64px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>

<script type="module">
/* ================= SETTINGS =================
   To collect everyone's answers in one place, paste your Firebase
   (Firestore) project details here. If you leave them empty, the page
   runs in TEST MODE: answers are saved only on this device. */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};

/* ================= QUESTIONS ================= */
const YES_NO_QUESTIONS = [
  "Would you like to spend your vacation camping?",
  "Do you enjoy hiking through forests or mountains?",
  "Do you like swimming in rivers, lakes, or waterfalls?",
  "Do you like watching sunrises or sunsets in nature?",
  "Do you like visiting museums?",
  "Do you enjoy walking around malls or plazas?",
  "Are you drawn to amusement parks?",
  "Do you like visiting cities with skyscrapers?",
  "Do you prefer traveling in a group rather than alone?"
];
const FINAL_QUESTION = "What do you prefer for your vacations?";
const TOTAL = YES_NO_QUESTIONS.length + 1;

/* ================= STORAGE ================= */
const useFirebase = Boolean(firebaseConfig.projectId);

async function startStore() {
  if (useFirebase) {
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [{ initializeApp }, fs] = await Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-firestore.js")
    ]);
    const db = fs.getFirestore(initializeApp(firebaseConfig));
    const col = fs.collection(db, "responses");
    return {
      save: (d) => fs.addDoc(col, { ...d, ts: fs.serverTimestamp() }),
      listen: (cb) => fs.onSnapshot(col, (s) => cb(s.docs.map((x) => x.data())))
    };
  }
  // Test mode: this device only
  const K = "vacation_survey_demo";
  const read = () => { try { return JSON.parse(localStorage.getItem(K) || "[]"); } catch { return []; } };
  const write = (a) => { try { localStorage.setItem(K, JSON.stringify(a)); } catch {} };
  const subscribers = new Set();
  return {
    save: async (d) => { const a = read(); a.push(d); write(a); subscribers.forEach((f) => f(a)); },
    listen: (cb) => { cb(read()); subscribers.add(cb); }
  };
}

/* ================= HELPERS ================= */
const app = document.getElementById("app");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const testBanner = () => useFirebase ? "" :
  `<div class="banner">Test mode: answers are saved only on this device. Connect Firebase to collect everyone's answers.</div>`;

/* ================= SURVEY ================= */
function nameView(state) {
  app.replaceChildren(el(`
    <section>
      ${testBanner()}
      <h1>Beach, forest, or city?</h1>
      <p>Answer 10 quick questions about your ideal vacation. It takes less than a minute.</p>
      <label for="name">Enter your name</label>
      <input id="name" type="text" autocomplete="given-name" maxlength="40" placeholder="Your name">
      <div class="error" id="err" role="alert"></div>
      <button class="b-main" id="start">Start</button>
    </section>`));
  const input = document.getElementById("name");
  const go = () => {
    const n = input.value.trim();
    if (!n) { document.getElementById("err").textContent = "Enter your name to continue."; input.focus(); return; }
    state.name = n; questionView(state);
  };
  document.getElementById("start").onclick = go;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

function questionView(state) {
  const i = state.answers.length;
  const isFinal = i === YES_NO_QUESTIONS.length;
  const text = isFinal ? FINAL_QUESTION : YES_NO_QUESTIONS[i];
  const buttons = isFinal
    ? `<button class="b-nat" data-v="natural">Natural places</button>
       <button class="b-man" data-v="manmade">Man-made places</button>`
    : `<button class="b-yes" data-v="yes">Yes</button>
       <button class="b-no" data-v="no">No</button>`;
  app.replaceChildren(el(`
    <section>
      <div class="progress"><div style="width:${(i / TOTAL) * 100}%"></div></div>
      <div class="counter">Question ${i + 1} of ${TOTAL}</div>
      <h2></h2>
      <div class="options">${buttons}</div>
      <div class="error" id="err" role="alert"></div>
      ${i > 0 ? `<button class="b-soft" id="back">Back to previous question</button>` : ""}
    </section>`));
  app.querySelector("h2").textContent = text;
  app.querySelectorAll(".options button").forEach((b) => {
    b.onclick = async () => {
      state.answers.push(b.dataset.v);
      if (state.answers.length < TOTAL) return questionView(state);
      await finish(state);
    };
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { state.answers.pop(); questionView(state); };
}

async function finish(state) {
  app.replaceChildren(el(`<p class="empty">Sending your answers…</p>`));
  try {
    const store = await startStore();
    await store.save({
      name: state.name,
      r: state.answers.slice(0, YES_NO_QUESTIONS.length),
      pref: state.answers[YES_NO_QUESTIONS.length]
    });
    app.replaceChildren(el(`
      <section>
        <div class="progress"><div style="width:100%"></div></div>
        <h1></h1>
        <p>Your answers have been saved. Have a great vacation!</p>
      </section>`));
    app.querySelector("h1").textContent = `Thank you, ${state.name}!`;
  } catch (e) {
    app.replaceChildren(el(`
      <section>
        <h1>Your answers could not be sent</h1>
        <p>Check your connection and try again.</p>
        <button class="b-main" id="retry">Try sending again</button>
      </section>`));
    document.getElementById("retry").onclick = () => finish(state);
  }
}

/* ================= RESULTS ================= */
function barRow(label, n, total, color) {
  const pct = total ? Math.round((n / total) * 100) : 0;
  return `<div class="row">
    <span class="lbl">${label}</span>
    <div class="bar"><div data-w="${pct}" style="background:${color}"></div></div>
    <span class="num">${n} · ${pct}%</span>
  </div>`;
}

function renderResults(data) {
  const total = data.length;
  if (!total) {
    app.replaceChildren(el(`<section>${testBanner()}<h1>Results</h1><p class="empty">No answers yet. Share the survey QR code.</p></section>`));
    return;
  }
  let html = `<section>${testBanner()}<h1>Results</h1>
    <div class="total">${total}<small>${total === 1 ? "person has answered" : "people have answered"}</small></div>`;

  const nat = data.filter((d) => d.pref === "natural").length;
  const man = data.filter((d) => d.pref === "manmade").length;
  html += `<div class="question final"><h3>${FINAL_QUESTION}</h3>
    ${barRow("Natural", nat, total, "var(--yes)")}
    ${barRow("Man-made", man, total, "var(--manmade)")}
  </div>`;

  YES_NO_QUESTIONS.forEach((q, i) => {
    const yes = data.filter((d) => d.r && d.r[i] === "yes").length;
    const no = data.filter((d) => d.r && d.r[i] === "no").length;
    html += `<div class="question"><h3>${q}</h3>
      ${barRow("Yes", yes, total, "var(--yes)")}
      ${barRow("No", no, total, "var(--no)")}
    </div>`;
  });
  html += `</section>`;

  app.replaceChildren(el(html));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    app.querySelectorAll(".bar > div").forEach((b) => { b.style.width = b.dataset.w + "%"; });
  }));
}

async function resultsView() {
  app.replaceChildren(el(`<p class="empty">Loading results…</p>`));
  try {
    const store = await startStore();
    store.listen(renderResults);
  } catch (e) {
    app.replaceChildren(el(`<section><h1>Results could not be loaded</h1><p>Check your connection and your Firebase settings.</p></section>`));
  }
}

/* ================= START =================
   Survey:  your-link/
   Results: your-link/#results */
function route() {
  if (location.hash === "#results") resultsView();
  else nameView({ name: "", answers: [] });
}
window.addEventListener("hashchange", () => location.reload());
route();
</script>
</body>
</html>
